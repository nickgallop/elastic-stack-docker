elastic:
  apm:
    active: true
    serverUrl: "http://fleet-server:8200"
    secretToken: ${ELASTIC_APM_SECRET_TOKEN}
server.host: "0.0.0.0"
telemetry.enabled: "true"
# NOTE: ssl.certificate_authorities pins the CA generated into the `certs` volume by the
# `setup` service. es01's cert doesn't present its issuing chain, so ca_trusted_fingerprint
# fails validation (x509: certificate signed by unknown authority) - inline PEM is required
# instead. If the `certs` volume is ever recreated, regenerate this from the new CA:
#   docker run --rm -v <project>_certs:/certs alpine cat /certs/ca/ca.crt
xpack.fleet.outputs:
  - id: fleet-default-output
    name: default
    type: elasticsearch
    hosts: ["https://es01:9200"]
    is_default: true
    is_default_monitoring: true
    ssl:
